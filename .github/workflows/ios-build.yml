name: iOS Build

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Test simulator selection
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Select available iPhone simulator
        run: python3 scripts/select_simulator.py >> "$GITHUB_ENV"

      - name: Build app for iOS Simulator
        run: |
          xcodebuild \
            -project MillionaireGame.xcodeproj \
            -scheme MillionaireGame \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=${{ env.IOS_SIMULATOR_UDID }}" \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Run unit tests
        run: |
          xcodebuild \
            -project MillionaireGame.xcodeproj \
            -scheme MillionaireGame \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=${{ env.IOS_SIMULATOR_UDID }}" \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            CODE_SIGNING_ALLOWED=NO \
            test
